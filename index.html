<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Anirudh Paliwal — Portfolio OS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anirudh Paliwal's portfolio showcasing game development and front-end web development projects, presented as an interactive desktop OS.">
    <meta name="author" content="Anirudh Paliwal">
    <meta name="keywords" content="Game Development, Front-end Web Development, Portfolio, Anirudh Paliwal, HTML, CSS, JavaScript">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="styling.css">
</head>
<body>

    <!-- ===================== BOOT SCREEN ===================== -->
    <div id="boot-screen">
        <div class="boot-orb">
            <span></span><span></span><span></span><span></span>
        </div>
        <p class="boot-title">Anirudh<span>OS</span></p>
        <p class="boot-subtitle">Starting up…</p>
    </div>

    <!-- ===================== LOGIN SCREEN ===================== -->
    <div id="login-screen" class="hidden">
        <div class="login-glow"></div>
        <div class="login-box">
            <div class="user-tile">AP</div>
            <p class="user-name">Anirudh Paliwal</p>
            <button id="login-btn" class="login-arrow" aria-label="Log in">
                <i class='bx bx-chevron-right'></i>
            </button>
            <p class="login-hint">Click the arrow or press Enter to log in</p>
        </div>
        <p class="login-footer">Game Developer &amp; Frontend Web Developer</p>
    </div>

    <!-- ===================== DESKTOP ===================== -->
    <div id="desktop" class="hidden">
        <div class="wallpaper">
            <svg class="wallpaper-ribbon" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <path d="M-100 700 C 300 500, 500 850, 900 600 S 1500 350, 1750 500 L 1750 950 L -100 950 Z" fill="url(#ribbonA)"/>
                <path d="M-100 780 C 350 600, 600 900, 1000 680 S 1500 480, 1750 620 L 1750 950 L -100 950 Z" fill="url(#ribbonB)"/>
                <defs>
                    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#1c4f8c"/>
                        <stop offset="100%" stop-color="#0b2a4d"/>
                    </linearGradient>
                    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#3a7fc4"/>
                        <stop offset="100%" stop-color="#164b7d"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Desktop icons -->
        <div class="desktop-icons">
            <button class="desktop-icon" data-window="about">
                <span class="icon-glyph about-glyph"><i class='bx bx-user'></i></span>
                <span class="icon-label">About Me</span>
            </button>
            <button class="desktop-icon" data-window="projects">
                <span class="icon-glyph projects-glyph"><i class='bx bx-folder'></i></span>
                <span class="icon-label">Projects</span>
            </button>
            <button class="desktop-icon" data-window="skills">
                <span class="icon-glyph skills-glyph"><i class='bx bx-wrench'></i></span>
                <span class="icon-label">Skills</span>
            </button>
            <button class="desktop-icon" data-window="experience">
                <span class="icon-glyph experience-glyph"><i class='bx bx-briefcase'></i></span>
                <span class="icon-label">Experience</span>
            </button>
            <button class="desktop-icon" data-window="education">
                <span class="icon-glyph education-glyph"><i class='bx bx-book-open'></i></span>
                <span class="icon-label">Education</span>
            </button>
            <button class="desktop-icon" data-window="resume">
                <span class="icon-glyph resume-glyph"><i class='bx bx-file'></i></span>
                <span class="icon-label">Resume</span>
            </button>
            <button class="desktop-icon" data-window="contact">
                <span class="icon-glyph contact-glyph"><i class='bx bx-envelope'></i></span>
                <span class="icon-label">Contact</span>
            </button>
            <button class="desktop-icon" data-window="terminal">
                <span class="icon-glyph terminal-glyph"><i class='bx bx-terminal'></i></span>
                <span class="icon-label">Terminal</span>
            </button>
            <button class="desktop-icon" data-window="recyclebin">
                <span class="icon-glyph bin-glyph"><i class='bx bx-trash'></i></span>
                <span class="icon-label">Recycle Bin</span>
            </button>
        </div>

        <!-- Windows render here -->
        <div id="windows-container"></div>

        <!-- ===================== START MENU ===================== -->
        <div id="start-menu" class="hidden">
            <div class="start-menu-left">
                <p class="start-section-label">Pinned</p>
                <button class="start-item" data-window="about">
                    <i class='bx bx-user'></i><span>About Me</span>
                </button>
                <button class="start-item" data-window="projects">
                    <i class='bx bx-folder'></i><span>Projects</span>
                </button>
                <button class="start-item" data-window="skills">
                    <i class='bx bx-wrench'></i><span>Skills</span>
                </button>
                <button class="start-item" data-window="experience">
                    <i class='bx bx-briefcase'></i><span>Experience</span>
                </button>
                <button class="start-item" data-window="education">
                    <i class='bx bx-book-open'></i><span>Education</span>
                </button>
                <button class="start-item" data-window="resume">
                    <i class='bx bx-file'></i><span>Resume</span>
                </button>
                <button class="start-item" data-window="contact">
                    <i class='bx bx-envelope'></i><span>Contact</span>
                </button>
                <button class="start-item" data-window="terminal">
                    <i class='bx bx-terminal'></i><span>Terminal</span>
                </button>
                <button class="start-item" data-window="recyclebin">
                    <i class='bx bx-trash'></i><span>Recycle Bin</span>
                </button>
            </div>
            <div class="start-menu-right">
                <div class="start-user">
                    <div class="start-user-tile">AP</div>
                    <span>Anirudh Paliwal</span>
                </div>
                <a href="https://github.com/Ani4games" target="_blank" class="start-link"><i class='bx bxl-github'></i> GitHub</a>
                <a href="mailto:anibro16@gmail.com" class="start-link"><i class='bx bx-envelope'></i> Email</a>
                <a href="https://linkedin.com" target="_blank" class="start-link"><i class='bx bxl-linkedin'></i> LinkedIn</a>
                <button id="shutdown-btn" class="start-shutdown"><i class='bx bx-power-off'></i> Shut down</button>
            </div>
        </div>

        <!-- ===================== TASKBAR ===================== -->
        <div id="taskbar">
            <button id="start-btn" aria-label="Start">
                <span class="start-orb"></span>
            </button>
            <div id="taskbar-apps"></div>
            <div id="system-tray">
                <i class='bx bx-volume-full'></i>
                <i class='bx bx-wifi'></i>
                <div id="clock">
                    <span id="clock-time">--:--</span>
                    <span id="clock-date">-- --- ----</span>
                </div>
                <div id="show-desktop" aria-label="Show desktop"></div>
            </div>
        </div>
    </div>

    <!-- ===================== SHUTDOWN OVERLAY ===================== -->
    <div id="shutdown-screen" class="hidden">
        <p>Shutting down…</p>
    </div>

    <!-- ===================== WINDOW CONTENT TEMPLATES ===================== -->
    <template id="tpl-about">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-user'></i><span>About Me</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body about-body">
            <div class="about-photo">AP</div>
            <div class="about-text">
                <h3>Hello! I'm Anirudh</h3>
                <p>I'm a passionate game developer and frontend web developer with expertise in creating engaging digital experiences. I love bringing ideas to life through code and design.</p>
                <p>My journey in technology has led me to work with various cutting-edge technologies and frameworks, always staying updated with the latest trends in both game development and web development.</p>
                <div class="skills">
                    <span class="skill-tag">Unity</span>
                    <span class="skill-tag">C#</span>
                    <span class="skill-tag">JavaScript</span>
                    <span class="skill-tag">HTML/CSS</span>
                    <span class="skill-tag">React</span>
                    <span class="skill-tag">Game Design</span>
                    <span class="skill-tag">UI/UX</span>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-projects">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-folder'></i><span>Projects</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body explorer-body">
            <div class="explorer-path"><i class='bx bx-folder-open'></i> Projects</div>
            <div class="projects-grid">
                <div class="project-card">
                    <div class="project-image"><i class='bx bxs-joystick'></i></div>
                    <h3 class="project-title">Space Dodger Game</h3>
                    <p class="project-description">An immersive 2D adventure game with custom mechanics and engaging AI.</p>
                    <div class="project-tech">
                        <span class="tech-tag">JavaScript</span>
                        <span class="tech-tag">HTML5</span>
                        <span class="tech-tag">2D Graphics</span>
                    </div>
                    <div class="project-links">
                        <a href="#" class="project-link">Demo</a>
                        <a href="https://github.com/Ani4games/Space-Dodger" class="project-link" target="_blank">Code</a>
                    </div>
                </div>
                <div class="project-card">
                    <div class="project-image"><i class='bx bx-window-alt'></i></div>
                    <h3 class="project-title">Portfolio Dashboard</h3>
                    <p class="project-description">A responsive web application for managing and showcasing creative portfolios.</p>
                    <div class="project-tech">
                        <span class="tech-tag">React</span>
                        <span class="tech-tag">JavaScript</span>
                        <span class="tech-tag">CSS3</span>
                    </div>
                    <div class="project-links">
                        <a href="http://port-folio-anirudh-paliwal.vercel.app/" class="project-link" target="_blank">Live Site</a>
                        <a href="https://github.com/Ani4games/PortFolio_AnirudhPaliwal" class="project-link" target="_blank">GitHub</a>
                    </div>
                </div>
                <div class="project-card">
                    <div class="project-image"><i class='bx bx-brain'></i></div>
                    <h3 class="project-title">Memory Master</h3>
                    <p class="project-description">A challenging memory game with innovative mechanics and beautiful visuals.</p>
                    <div class="project-tech">
                        <span class="tech-tag">JavaScript</span>
                        <span class="tech-tag">Mobile</span>
                        <span class="tech-tag">Game Design</span>
                    </div>
                    <div class="project-links">
                        <a href="https://github.com/Ani4games/Memory-Game" class="project-link" target="_blank">GitHub</a>
                        <a href="#" class="project-link">Trailer</a>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-contact">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-envelope'></i><span>Contact</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body contact-body">
            <div class="contact-info">
                <h3>Let's Connect!</h3>
                <p>I'm always open to discussing new opportunities, collaborations, or just having a chat about technology and games.</p>
                <div class="contact-item"><i class='bx bx-phone'></i><div><p>+91 7284068878</p><p>+91 7041002373</p></div></div>
                <div class="contact-item"><i class='bx bx-envelope'></i><div><p>anibro16@gmail.com</p><p>anipalgames016@gmail.com</p></div></div>
                <div class="social-icons">
                    <a href="https://github.com" class="social-icon" target="_blank"><i class='bx bxl-github'></i></a>
                    <a href="https://linkedin.com" class="social-icon" target="_blank"><i class='bx bxl-linkedin'></i></a>
                    <a href="https://twitter.com" class="social-icon" target="_blank"><i class='bx bxl-twitter'></i></a>
                    <a href="https://instagram.com" class="social-icon" target="_blank"><i class='bx bxl-instagram'></i></a>
                </div>
            </div>
            <form class="contact-form" id="contact-form">
                <h3>Send a Message</h3>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="4" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </template>

    <template id="tpl-recyclebin">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-trash'></i><span>Recycle Bin</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body bin-body">
            <i class='bx bx-trash bin-empty-icon'></i>
            <p>Recycle Bin is empty.</p>
            <p class="bin-sub">No old ideas thrown away here — only shipped ones.</p>
        </div>
    </template>

    <template id="tpl-skills">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-wrench'></i><span>Skills</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body skills-body">
            <div class="skill-group">
                <h4><i class='bx bxs-joystick'></i> Game Development</h4>
                <div class="skills"><span class="skill-tag">Unity</span><span class="skill-tag">C#</span><span class="skill-tag">Game Design</span></div>
            </div>
            <div class="skill-group">
                <h4><i class='bx bx-code-alt'></i> Web Development</h4>
                <div class="skills"><span class="skill-tag">JavaScript</span><span class="skill-tag">HTML/CSS</span><span class="skill-tag">React</span></div>
            </div>
            <div class="skill-group">
                <h4><i class='bx bx-palette'></i> Design</h4>
                <div class="skills"><span class="skill-tag">UI/UX</span></div>
            </div>
            <p class="skills-note">More tools and technologies coming as I keep building.</p>
        </div>
    </template>

    <template id="tpl-experience">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-briefcase'></i><span>Experience</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body timeline-body">
            <div class="placeholder-notice"><i class='bx bx-info-circle'></i> Sample entry — replace with your real work history in index.html.</div>
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <h4>Role Title</h4>
                    <p class="timeline-meta">Company / Studio Name &middot; Year – Year</p>
                    <p>Short description of what you did and what you shipped.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-education">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-book-open'></i><span>Education</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body timeline-body">
            <div class="placeholder-notice"><i class='bx bx-info-circle'></i> Sample entry — replace with your real education details in index.html.</div>
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <h4>Degree / Course Name</h4>
                    <p class="timeline-meta">Institution Name &middot; Year – Year</p>
                    <p>Relevant coursework, focus area, or achievements.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-resume">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-file'></i><span>Resume</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body resume-body">
            <i class='bx bxs-file-pdf resume-icon'></i>
            <h3>Anirudh Paliwal — Resume</h3>
            <p>Add your resume PDF to the project folder as <code>resume.pdf</code> and this button will download it.</p>
            <a href="resume.pdf" download class="resume-download-btn"><i class='bx bx-download'></i> Download Resume</a>
        </div>
    </template>

    <template id="tpl-terminal">
        <div class="win-titlebar">
            <div class="win-title"><i class='bx bx-terminal'></i><span>Terminal</span></div>
            <div class="win-controls">
                <button class="win-min" aria-label="Minimize"><i class='bx bx-minus'></i></button>
                <button class="win-max" aria-label="Maximize"><i class='bx bx-square'></i></button>
                <button class="win-close" aria-label="Close"><i class='bx bx-x'></i></button>
            </div>
        </div>
        <div class="win-body terminal-body">
            <div class="terminal-output">
                <p>AnirudhOS Terminal — type <span class="term-hl">help</span> to see available commands.</p>
            </div>
            <div class="terminal-input-line">
                <span class="term-prompt">anirudh@portfolio:~$</span>
                <input type="text" class="terminal-input" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
